<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ghostlap Roma app icon: the night track through Rome with the two racers as chess pieces. The red king is you,
       the pale knight is your ghost. tools/build-icon.mjs renders every PNG size from this file. Piece drawings: cburnett
       (vendor/pieces/LICENSE.txt). -->
  <style>.f{fill:var(--f)}.e{fill:var(--e)}</style>
  <defs>
    <radialGradient id="glow" cx="330" cy="170" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c4520"/>
      <stop offset=".55" stop-color="#1c1810"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <path id="track" d="M-40 442 C 224 442 288 70 552 70" fill="none"/>
    <g id="king" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
      <path class="f" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
      <path class="f" d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
    <g id="knight" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path class="f" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path class="f" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <path class="e" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#0b0d12"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- the track: kerb base, red kerb blocks, asphalt, centre line -->
  <use href="#track" stroke="#d8d2c8" stroke-width="140"/>
  <use href="#track" stroke="#c4262c" stroke-width="140" stroke-dasharray="24 24"/>
  <use href="#track" stroke="#2a2d33" stroke-width="118"/>
  <use href="#track" stroke="#777a80" stroke-width="5" stroke-dasharray="24 22" stroke-linecap="round"/>

  <!-- the ghost knight, chasing along the bottom straight (mirrored so it faces the way it is going) -->
  <g transform="translate(152 400) rotate(-10)" stroke="#a9c9ec" stroke-linecap="round">
    <path d="M-104 -10h40M-96 10h26M-86 -30h20" stroke-width="7" opacity=".5"/>
  </g>
  <g transform="translate(152 400) rotate(-6) scale(-3.6 3.6) translate(-22.5 -23.5)" stroke-width="2.2" style="--f:rgba(169,201,236,.34);--e:#a9c9ec">
    <use href="#knight" stroke="#b9d5f2"/>
  </g>

  <!-- the red king, leading through the esses -->
  <g transform="translate(336 176) rotate(-55)" stroke="#e03a3a" stroke-linecap="round">
    <path d="M-132 -10h40M-124 10h26M-114 -30h20" stroke-width="7" opacity=".55"/>
  </g>
  <g transform="translate(336 176) rotate(28) scale(4) translate(-22.5 -23)" stroke-width="1.9" style="--f:#d92d33;--e:#3a0b0d">
    <use href="#king" stroke="#3a0b0d"/>
  </g>
</svg>
